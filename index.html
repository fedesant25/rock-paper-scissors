<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">

<h2 style="text-align: center;">Make your choice ...</h2>

<div style="display: flex; justify-content: center; gap: 15px" class="buttons">
<button id="rock">Rock</button>
<button id="paper">Paper</button>
<button id="scissors">Scissors</button>
</div>

<div id="outcomeDiv" style="margin: 50px;"></div>

<script>

let humanScore = 0;
let computerScore = 0;

// Function to get Computer's choice

function getComputerChoice() {
    const randomNum = Math.floor(Math.random() * 3) + 1;
    if (randomNum === 1) return 'rock';
    if (randomNum === 2) return 'paper';
    return 'scissors';
}

// Function to get Human's choice

const rock = document.querySelector("#rock")
const paper = document.querySelector("#paper")
const scissors = document.querySelector("#scissors")

rock.addEventListener ("click", (e) => {
    const humanSelection = "rock";
    const computerChoice = getComputerChoice ();
    playRound (humanSelection, computerChoice);
})

paper.addEventListener ("click", (e) => {
    const humanSelection = "paper";
    const computerChoice = getComputerChoice ();
    playRound (humanSelection, computerChoice);
})

scissors.addEventListener ("click", (e) => {
    const humanSelection = "scissors";
    const computerChoice = getComputerChoice ();
    playRound (humanSelection, computerChoice);
})



// Logic to play one round
function playRound(humanSelection, computerChoice) {

    console.log(`Human: ${humanSelection} vs Computer: ${computerChoice}`);
    const outcomeDiv = document.querySelector('#outcomeDiv');
    
    if (humanSelection === computerChoice) {
                outcomeDiv.textContent = "It's a tie! 🤝";
                outcomeDiv.className = "tie"
    } else if (humanSelection === "rock" && computerChoice === "scissors"){
                outcomeDiv.textContent = "You win !!"
                outcomeDiv.className = "user-wins"
    } else if (humanSelection === "rock" && computerChoice === "paper"){
                outcomeDiv.textContent = "You lose"
                outcomeDiv.className = "computer-wins"
    } else if (humanSelection === "scissors" && computerChoice === "rock"){
                outcomeDiv.textContent = "You lose"
                outcomeDiv.className = "computer-wins"
    } else if (humanSelection === "scissors" && computerChoice === "paper"){
                outcomeDiv.textContent = "You win !!"
                outcomeDiv.textContent = "user-wins"
    } else if (humanSelection === "paper" && computerChoice === "rock"){
                outcomeDiv.textContent = "You win !!"
                outcomeDiv.textContent = "user-wins"
    } else if (humanSelection === "paper" && computerChoice === "scissors"){
                outcomeDiv.textContent = "You lose"
                outcomeDiv.textContent = "computer-wins"
    }
}

// Start the game


// UI




</script>
    
</body>
</html>
